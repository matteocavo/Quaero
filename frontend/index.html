<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230284c7' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><circle cx='11' cy='11' r='7'></circle><path d='m21 21-4.35-4.35'></path><circle cx='11' cy='11' r='2.5' fill='%230284c7' fill-opacity='0.4'></circle></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quaero Web</title>
    <meta name="description" content="Enterprise-grade web operations console and analytics platform for Quaero data pipelines, data quality validation, anomaly framing, mart exploration, and interactive lineage." />
    <meta property="og:title" content="Quaero Web" />
    <meta property="og:description" content="Enterprise-grade web operations console and analytics platform for Quaero data pipelines, data quality validation, anomaly framing, mart exploration, and interactive lineage." />
    <meta property="og:type" content="website" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Apply the theme before the first paint so the page never flashes the wrong one. Same rules as
      // src/utils/theme.ts: dark unless the stored choice is light, or system and the device prefers light.
      (function () {
        try {
          var choice = window.localStorage.getItem('quaero_theme_preference');
          var dark = choice === 'light' ? false : choice === 'system' ? window.matchMedia('(prefers-color-scheme: dark)').matches : true;
          if (dark) document.documentElement.classList.add('dark');
        } catch (error) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-sky-500/20 selection:text-sky-700 dark:bg-slate-950 dark:text-slate-100 dark:selection:bg-sky-500/30 dark:selection:text-sky-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
