name: Web CI and Pages

# Builds and tests the React web app. The static Public Demo is published to GitHub Pages only when this
# workflow is started manually (workflow_dispatch); pull requests build and test but never deploy.
on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Node
        uses: actions/setup-node@v4.2.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build for GitHub Pages
        run: npm run build
        env:
          VITE_BASE_PATH: /Quaero/
          # Sentinel: proves the bundle check would catch a key leaking into the build.
          QUAERO_API_KEY: ci-sentinel-not-a-real-key

      - name: Check the bundle for secrets and unexpected hosts
        run: npm run check:bundle
        env:
          QUAERO_API_KEY: ci-sentinel-not-a-real-key

      - name: Upload Pages artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: frontend/dist

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5
